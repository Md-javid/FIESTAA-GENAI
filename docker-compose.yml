# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — MediCode AI v3.0 (Django + React + Nginx)
#
# Services:
#   medicode-backend   → Django/Gunicorn API on port 8000 (internal)
#   medicode-frontend  → Nginx serving React SPA on port 3000 (public)
#
# Usage:
#   docker compose up --build          ← first run / after code changes
#   docker compose up -d               ← detached (background)
#   docker compose down                ← stop and remove containers
#   docker compose logs -f             ← follow logs
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend — Django / Gunicorn ──────────────────────────────────────────────
  medicode-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medicode-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,medicode-backend"
      ALLOWED_ORIGINS: "http://localhost:3000,http://medicode-frontend:80"
      # Uncomment to use PostgreSQL instead of SQLite:
      # DATABASE_URL: "postgresql://medicode:medicode@medicode-db:5432/medicode"

      # Backend internal only — nginx proxies /api/* to it
      # ports:
      #   - "8000:8000"

    networks:
      - medicode-net

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/auth/health/')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    volumes:
      - backend-media:/app/media
      - backend-static:/app/staticfiles

    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  # # ── Optional: PostgreSQL ───────────────────────────────────────────────────
  # medicode-db:
  #   image: postgres:16-alpine
  #   container_name: medicode-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: medicode
  #     POSTGRES_USER: medicode
  #     POSTGRES_PASSWORD: medicode
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - medicode-net

  # ── Frontend — Nginx serving React/Vite build ────────────────────────────────
  medicode-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:8000"
    container_name: medicode-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    networks:
      - medicode-net

    depends_on:
      medicode-backend:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:80/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  backend-media:
  backend-static:
    # postgres-data:

    # ── Shared network ─────────────────────────────────────────────────────────────
networks:
  medicode-net:
    driver: bridge
    name: medicode-network
