# ─────────────────────────────────────────────────────────────────────────────
# Nginx config for MediCode AI Frontend (Docker)
#
# Responsibilities:
#  1. Serve Vite static build (SPA — all routes → index.html)
#  2. Reverse-proxy /api/* → backend container (medicode-backend:5001)
#  3. Enable gzip for assets
#  4. Security headers
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options         "SAMEORIGIN"   always;
    add_header X-Content-Type-Options  "nosniff"      always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Static assets — long cache ────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API reverse proxy → backend service ──────────────────────────────────
    location /api/ {
        proxy_pass         http://medicode-backend:8000;
        proxy_http_version 1.1;

        # SSE / streaming support
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering for SSE streaming responses
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # CORS pass-through
        proxy_pass_header  Access-Control-Allow-Origin;
    }

    # ── SPA fallback — all routes serve index.html ────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Hide Nginx version ────────────────────────────────────────────────────
    server_tokens off;
}
